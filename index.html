<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 3D Character</title>
    <!-- โหลดสคริปต์แสดงผล 3D จาก Google -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #e0e0e0; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- แสดงผลไฟล์ 3D (เปิดให้หมุนได้ ซูมได้ และหมุนอัตโนมัติ) -->
    <!-- หากต้องการเปลี่ยนเป็นตัวละครหญิง ให้เปลี่ยนจาก ชาย บีบกลาง.glb เป็น Female Student.compressed.glb -->
    <model-viewer 
        src="ชาย บีบกลาง.glb" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
