<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Viewer</title>
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body { margin: 0; background: #222; font-family: sans-serif; }
        model-viewer { width: 100%; height: 100vh; }
        .menu { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 10px; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 20px; cursor: pointer; background: white; color: black; font-weight: bold; transition: 0.3s; }
        button:hover { background: #00ffcc; }
        button.active { background: #00ffcc; }
    </style>
</head>
<body>

    <!-- เมนูปุ่มกดสลับตัวละคร -->
    <div class="menu">
        <button id="btnFemale" class="active" onclick="changeCharacter('Female Student.compressed.glb', this)">ตัวละครหญิง</button>
        <button id="btnMale" onclick="changeCharacter('ชาย บีบกลาง.glb', this)">ตัวละครชาย</button>
    </div>

    <!-- ส่วนแสดงผล 3D -->
    <model-viewer 
        id="avatar"
        src="Female Student.compressed.glb" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1">
    </model-viewer>

    <script>
        function changeCharacter(fileName, element) {
            // เปลี่ยนไฟล์ 3D ใน model-viewer
            document.getElementById('avatar').src = fileName;
            
            // เปลี่ยนสถานะปุ่มที่ถูกกด
            document.querySelectorAll('button').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
